<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="900" height="400" fill="#ffffff"/><text x="40" y="34" font-size="18">Qual bit gera cada indice: o bit k cobre os indices 2k e 2k+1</text><rect x="69" y="96" width="130" height="78" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" rx="6"/><text x="134.0" y="88" font-size="14" fill="#b45309" text-anchor="middle">bit 0</text><rect x="225" y="96" width="130" height="78" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" rx="6"/><text x="290.0" y="88" font-size="14" fill="#b45309" text-anchor="middle">bit 1</text><rect x="381" y="96" width="130" height="78" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" rx="6"/><text x="446.0" y="88" font-size="14" fill="#b45309" text-anchor="middle">bit 2</text><rect x="537" y="96" width="130" height="78" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" rx="6"/><text x="602.0" y="88" font-size="14" fill="#b45309" text-anchor="middle">bit 3</text><circle cx="95" cy="135" r="20" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="95" y="141" font-size="16" text-anchor="middle">0</text><circle cx="173" cy="135" r="20" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="173" y="141" font-size="16" text-anchor="middle">1</text><circle cx="251" cy="135" r="20" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="251" y="141" font-size="16" text-anchor="middle">2</text><circle cx="329" cy="135" r="20" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="329" y="141" font-size="16" text-anchor="middle">3</text><circle cx="407" cy="135" r="20" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="407" y="141" font-size="16" text-anchor="middle">4</text><circle cx="485" cy="135" r="20" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="485" y="141" font-size="16" text-anchor="middle">5</text><circle cx="563" cy="135" r="20" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="563" y="141" font-size="16" text-anchor="middle">6</text><circle cx="641" cy="135" r="20" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="641" y="141" font-size="16" text-anchor="middle">7</text><text x="40" y="206" font-size="13.5" fill="#555">o bit de um indice n e k = parte inteira de n/2</text><path d="M95,240 Q134.0,288 173,240" fill="none" stroke="#15803d" stroke-width="2.4"/><circle cx="95" cy="240" r="4" fill="#15803d"/><circle cx="173" cy="240" r="4" fill="#15803d"/><text x="134.0" y="308" font-size="12.5" fill="#15803d" text-anchor="middle">mesmo bit</text><text x="134.0" y="326" font-size="13" fill="#15803d" text-anchor="middle">C = &#8722;1</text><text x="134.0" y="232" font-size="12" fill="#555" text-anchor="middle">(0,1)</text><path d="M173,240 Q212.0,288 251,240" fill="none" stroke="#b91c1c" stroke-width="2.4"/><circle cx="173" cy="240" r="4" fill="#b91c1c"/><circle cx="251" cy="240" r="4" fill="#b91c1c"/><text x="212.0" y="308" font-size="12.5" fill="#b91c1c" text-anchor="middle">bits dif.</text><text x="212.0" y="326" font-size="13" fill="#b91c1c" text-anchor="middle">C = 0</text><text x="212.0" y="232" font-size="12" fill="#555" text-anchor="middle">(1,2)</text><path d="M251,240 Q290.0,288 329,240" fill="none" stroke="#15803d" stroke-width="2.4"/><circle cx="251" cy="240" r="4" fill="#15803d"/><circle cx="329" cy="240" r="4" fill="#15803d"/><text x="290.0" y="308" font-size="12.5" fill="#15803d" text-anchor="middle">mesmo bit</text><text x="290.0" y="326" font-size="13" fill="#15803d" text-anchor="middle">C = &#8722;1</text><text x="290.0" y="232" font-size="12" fill="#555" text-anchor="middle">(2,3)</text><path d="M329,240 Q368.0,288 407,240" fill="none" stroke="#b91c1c" stroke-width="2.4"/><circle cx="329" cy="240" r="4" fill="#b91c1c"/><circle cx="407" cy="240" r="4" fill="#b91c1c"/><text x="368.0" y="308" font-size="12.5" fill="#b91c1c" text-anchor="middle">bits dif.</text><text x="368.0" y="326" font-size="13" fill="#b91c1c" text-anchor="middle">C = 0</text><text x="368.0" y="232" font-size="12" fill="#555" text-anchor="middle">(3,4)</text><path d="M407,240 Q446.0,288 485,240" fill="none" stroke="#15803d" stroke-width="2.4"/><circle cx="407" cy="240" r="4" fill="#15803d"/><circle cx="485" cy="240" r="4" fill="#15803d"/><text x="446.0" y="308" font-size="12.5" fill="#15803d" text-anchor="middle">mesmo bit</text><text x="446.0" y="326" font-size="13" fill="#15803d" text-anchor="middle">C = &#8722;1</text><text x="446.0" y="232" font-size="12" fill="#555" text-anchor="middle">(4,5)</text><text x="40" y="364" font-size="14" fill="#333">Entre vizinhos os casos se alternam: (0,1) mesmo bit, (1,2) bits diferentes, (2,3) mesmo bit, e assim por diante.</text><text x="40" y="386" font-size="13.5" fill="#555">O que decide e a paridade do menor indice: par comeca um bit novo, impar fecha o bit anterior.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>