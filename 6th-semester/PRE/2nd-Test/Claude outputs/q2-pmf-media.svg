<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#1a1a1a"/></marker></defs><rect width="900" height="560" fill="#ffffff"/><text x="40" y="38" font-size="18">(b) PMF de primeira ordem: um esboco por intervalo relevante</text><text x="200" y="70" font-size="15" text-anchor="middle">para 0 &lt; t &lt; 8</text><line x1="110" y1="300" x2="340" y2="300" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="130" y1="300" x2="130" y2="90" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><text x="348" y="306" font-size="14" font-style="italic">x</text><line x1="170" y1="300" x2="170" y2="187.5" stroke="#1d4ed8" stroke-width="3"/><circle cx="170" cy="187.5" r="5" fill="#1d4ed8"/><line x1="130" y1="187.5" x2="170" y2="187.5" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><text x="122" y="192.5" font-size="12.5" text-anchor="end">9/16</text><text x="170" y="320" font-size="14" text-anchor="middle">0</text><line x1="240" y1="300" x2="240" y2="225.0" stroke="#1d4ed8" stroke-width="3"/><circle cx="240" cy="225.0" r="5" fill="#1d4ed8"/><line x1="130" y1="225.0" x2="240" y2="225.0" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><text x="122" y="230.0" font-size="12.5" text-anchor="end">6/16</text><text x="240" y="320" font-size="14" text-anchor="middle">1</text><line x1="310" y1="300" x2="310" y2="287.5" stroke="#1d4ed8" stroke-width="3"/><circle cx="310" cy="287.5" r="5" fill="#1d4ed8"/><line x1="130" y1="287.5" x2="310" y2="287.5" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><text x="122" y="292.5" font-size="12.5" text-anchor="end">1/16</text><text x="310" y="320" font-size="14" text-anchor="middle">2</text><text x="620" y="70" font-size="15" text-anchor="middle">para t &lt; 0 ou t &gt; 8</text><line x1="530" y1="300" x2="760" y2="300" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="550" y1="300" x2="550" y2="90" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><text x="768" y="306" font-size="14" font-style="italic">x</text><line x1="590" y1="300" x2="590" y2="100.0" stroke="#1d4ed8" stroke-width="3"/><circle cx="590" cy="100.0" r="5" fill="#1d4ed8"/><line x1="550" y1="100.0" x2="590" y2="100.0" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><text x="542" y="105.0" font-size="12.5" text-anchor="end">1</text><text x="590" y="320" font-size="14" text-anchor="middle">0</text><text x="660" y="320" font-size="14" text-anchor="middle">1</text><text x="730" y="320" font-size="14" text-anchor="middle">2</text><text x="40" y="350" font-size="13.5" fill="#555">A PMF de primeira ordem e a mesma em (0,4) e em (4,8): ela nao distingue as duas metades. Quem distingue e a de segunda ordem, do item (d).</text><text x="40" y="402" font-size="18">(c) Funcao media</text><line x1="100" y1="500" x2="780" y2="500" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="150" y1="504" x2="150" y2="420" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><path d="M100,500 L150,500 L150,440 L630,440 L630,500 L775,500" fill="none" stroke="#1d4ed8" stroke-width="3"/><line x1="150" y1="440" x2="630" y2="440" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><text x="142" y="445" font-size="13" text-anchor="end">1/2</text><text x="150" y="520" font-size="13" text-anchor="middle">0</text><text x="630" y="520" font-size="13" text-anchor="middle">8</text><text x="390" y="520" font-size="13" text-anchor="middle">4</text><line x1="390" y1="500" x2="390" y2="505" stroke="#1a1a1a" stroke-width="1.2"/><text x="788" y="506" font-size="14" font-style="italic">t</text><text x="114" y="424" font-size="14">&#956;&#8339;(t)</text><text x="40" y="542" font-size="13.5" fill="#555">Degrau unico: nao ha quebra em t = 4, porque E[A+C] = E[B+C] = 1/2.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>