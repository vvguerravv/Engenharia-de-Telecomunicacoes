<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="900" height="660" fill="#ffffff"/>

  <!-- ===== Painel 1: PMF de X(0,3) ===== -->
  <text x="100" y="48" font-size="19" fill="#1a1a1a">(a)  PMF de X(0,3) ~ Bernoulli(0,3)</text>
  <!-- eixos -->
  <line x1="100" y1="280" x2="330" y2="280" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="120" y1="280" x2="120" y2="90" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="338" y="286" font-size="16" font-style="italic">x</text>
  <text x="78" y="86" font-size="16">p</text>
  <!-- hastes -->
  <line x1="160" y1="280" x2="160" y2="168" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="160" cy="168" r="5.5" fill="#1d4ed8"/>
  <line x1="260" y1="280" x2="260" y2="232" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="260" cy="232" r="5.5" fill="#1d4ed8"/>
  <!-- guias -->
  <line x1="120" y1="168" x2="160" y2="168" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="120" y1="232" x2="260" y2="232" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="90" y="173" font-size="14" text-anchor="end">0,7</text>
  <text x="90" y="237" font-size="14" text-anchor="end">0,3</text>
  <text x="160" y="302" font-size="15" text-anchor="middle">0</text>
  <text x="260" y="302" font-size="15" text-anchor="middle">1</text>

  <!-- ===== Painel 2: PMF de X(1,7) ===== -->
  <text x="540" y="48" font-size="19" fill="#1a1a1a">PMF de X(1,7) ~ Bernoulli(0,3)</text>
  <line x1="540" y1="280" x2="770" y2="280" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="560" y1="280" x2="560" y2="90" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="778" y="286" font-size="16" font-style="italic">x</text>
  <text x="518" y="86" font-size="16">p</text>
  <line x1="600" y1="280" x2="600" y2="168" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="600" cy="168" r="5.5" fill="#1d4ed8"/>
  <line x1="700" y1="280" x2="700" y2="232" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="700" cy="232" r="5.5" fill="#1d4ed8"/>
  <line x1="560" y1="168" x2="600" y2="168" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="560" y1="232" x2="700" y2="232" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="530" y="173" font-size="14" text-anchor="end">0,7</text>
  <text x="530" y="237" font-size="14" text-anchor="end">0,3</text>
  <text x="600" y="302" font-size="15" text-anchor="middle">0</text>
  <text x="700" y="302" font-size="15" text-anchor="middle">1</text>

  <text x="100" y="340" font-size="15" fill="#555">Os dois esbocos sao iguais: em t = 0,3 e em t = 1,7 a janela cobre o mesmo comprimento (0,3) do suporte de A.</text>

  <!-- ===== Painel 3: funcao media ===== -->
  <text x="100" y="408" font-size="19" fill="#1a1a1a">(b)  Funcao media  &#956;&#8339;(t)   [ = p(t), o parametro da Bernoulli ]</text>
  <!-- eixos -->
  <line x1="90" y1="600" x2="800" y2="600" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="140" y1="600" x2="140" y2="430" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="808" y="606" font-size="16" font-style="italic">t</text>
  <text x="104" y="426" font-size="16">&#956;&#8339;(t)</text>
  <!-- curva -->
  <path d="M90,600 L140,600 L340,440 L540,600 L800,600" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <!-- guias -->
  <line x1="140" y1="440" x2="340" y2="440" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="340" y1="600" x2="340" y2="440" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="128" y="445" font-size="14" text-anchor="end">1</text>
  <text x="140" y="622" font-size="15" text-anchor="middle">0</text>
  <text x="340" y="622" font-size="15" text-anchor="middle">1</text>
  <text x="540" y="622" font-size="15" text-anchor="middle">2</text>
  <!-- rotulos dos trechos -->
  <text x="232" y="508" font-size="14" fill="#1d4ed8" text-anchor="middle" transform="rotate(-38 232 508)">&#956; = t</text>
  <text x="446" y="508" font-size="14" fill="#1d4ed8" text-anchor="middle" transform="rotate(38 446 508)">&#956; = 2 &#8722; t</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
