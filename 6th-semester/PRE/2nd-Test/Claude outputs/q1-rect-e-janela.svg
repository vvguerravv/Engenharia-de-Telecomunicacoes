<svg xmlns="http://www.w3.org/2000/svg" width="900" height="830" viewBox="0 0 900 830" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="900" height="830" fill="#ffffff"/>

  <!-- ============ A: definicao de rect ============ -->
  <text x="40" y="40" font-size="18">1)  rect(u): vale 1 perto de zero, 0 longe</text>
  <line x1="60" y1="180" x2="280" y2="180" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="160" y1="185" x2="160" y2="105" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M60,180 L110,180 L110,120 L210,120 L210,180 L275,180" fill="none" stroke="#1d4ed8" stroke-width="2.8"/>
  <text x="288" y="186" font-size="14" font-style="italic">u</text>
  <text x="110" y="200" font-size="13" text-anchor="middle">&#8722;1/2</text>
  <text x="210" y="200" font-size="13" text-anchor="middle">1/2</text>
  <text x="152" y="125" font-size="13" text-anchor="end">1</text>
  <text x="60" y="228" font-size="13.5" fill="#555">largura 1, centrado em u = 0</text>

  <!-- ============ B: rect(t - A) ============ -->
  <text x="420" y="40" font-size="18">2)  rect(t &#8722; A): o mesmo pulso, so que centrado em A</text>
  <line x1="450" y1="180" x2="800" y2="180" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="500" y1="185" x2="500" y2="105" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M450,180 L544,180 L544,120 L654,120 L654,180 L795,180" fill="none" stroke="#1d4ed8" stroke-width="2.8"/>
  <line x1="599" y1="180" x2="599" y2="112" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="599" y="106" font-size="13" fill="#b45309" text-anchor="middle">A</text>
  <text x="808" y="186" font-size="14" font-style="italic">t</text>
  <text x="544" y="200" font-size="12.5" text-anchor="middle">A&#8722;1/2</text>
  <text x="654" y="200" font-size="12.5" text-anchor="middle">A+1/2</text>
  <text x="492" y="200" font-size="13" text-anchor="middle">0</text>
  <text x="420" y="228" font-size="13.5" fill="#555">o argumento t &#8722; A zera quando t = A, entao o pulso "anda" junto com A</text>

  <!-- ============ C: funcoes-amostra cortadas em t = 0,3 ============ -->
  <text x="40" y="276" font-size="18">3)  Congele t = 0,3 (linha laranja) e pergunte: o pulso cobre esse instante?</text>

  <!-- linha vertical t=0,3 atravessando as faixas -->
  <line x1="205" y1="296" x2="205" y2="580" stroke="#b45309" stroke-width="2"/>
  <text x="205" y="596" font-size="13" fill="#b45309" text-anchor="middle">t = 0,3</text>

  <!-- faixa 1: A=0,55 ON  pulso 167.5..317.5 -->
  <text x="110" y="330" font-size="13" text-anchor="end">A = 0,55</text>
  <line x1="115" y1="330" x2="500" y2="330" stroke="#9ca3af" stroke-width="1"/>
  <path d="M115,330 L168,330 L168,303 L318,303 L318,330 L495,330" fill="none" stroke="#1d4ed8" stroke-width="2.4"/>
  <text x="560" y="335" font-size="14" fill="#15803d" text-anchor="middle">X(0,3) = 1</text>

  <!-- faixa 2: A=0,70 ON pulso 190..340 -->
  <text x="110" y="390" font-size="13" text-anchor="end">A = 0,70</text>
  <line x1="115" y1="390" x2="500" y2="390" stroke="#9ca3af" stroke-width="1"/>
  <path d="M115,390 L190,390 L190,363 L340,363 L340,390 L495,390" fill="none" stroke="#1d4ed8" stroke-width="2.4"/>
  <text x="560" y="395" font-size="14" fill="#15803d" text-anchor="middle">X(0,3) = 1</text>

  <!-- faixa 3: A=0,78 ON (no limite) pulso 202..352 -->
  <text x="110" y="450" font-size="13" text-anchor="end">A = 0,78</text>
  <line x1="115" y1="450" x2="500" y2="450" stroke="#9ca3af" stroke-width="1"/>
  <path d="M115,450 L202,450 L202,423 L352,423 L352,450 L495,450" fill="none" stroke="#1d4ed8" stroke-width="2.4"/>
  <text x="560" y="455" font-size="14" fill="#15803d" text-anchor="middle">X(0,3) = 1</text>
  <text x="662" y="455" font-size="12.5" fill="#15803d">no limite</text>

  <!-- faixa 4: A=0,90 OFF pulso 220..370 -->
  <text x="110" y="510" font-size="13" text-anchor="end">A = 0,90</text>
  <line x1="115" y1="510" x2="500" y2="510" stroke="#9ca3af" stroke-width="1"/>
  <path d="M115,510 L220,510 L220,483 L370,483 L370,510 L495,510" fill="none" stroke="#1d4ed8" stroke-width="2.4"/>
  <text x="560" y="515" font-size="14" fill="#b91c1c" text-anchor="middle">X(0,3) = 0</text>

  <!-- faixa 5: A=1,30 OFF pulso 280..430 -->
  <text x="110" y="570" font-size="13" text-anchor="end">A = 1,30</text>
  <line x1="115" y1="570" x2="500" y2="570" stroke="#9ca3af" stroke-width="1"/>
  <path d="M115,570 L280,570 L280,543 L430,543 L430,570 L495,570" fill="none" stroke="#1d4ed8" stroke-width="2.4"/>
  <text x="560" y="575" font-size="14" fill="#b91c1c" text-anchor="middle">X(0,3) = 0</text>

  <text x="40" y="624" font-size="13.5" fill="#555">O pulso cobre t = 0,3 exatamente quando seu centro A esta a menos de 1/2 de distancia de 0,3.</text>
  <text x="40" y="646" font-size="13.5" fill="#555">Isso da a condicao 0,3 &#8722; 1/2 &lt; A &lt; 0,3 + 1/2, ou seja, A entre &#8722;0,2 e 0,8. Essa e a "janela".</text>

  <!-- ============ D: a janela vive no eixo A ============ -->
  <text x="40" y="692" font-size="18">4)  A janela mora no eixo de A (nao no eixo do tempo)</text>
  <rect x="230" y="722" width="54" height="50" fill="#bfdbfe"/>
  <path d="M140,772 L230,772 L230,722 L410,722 L410,772 L540,772" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
  <line x1="140" y1="772" x2="560" y2="772" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="568" y="778" font-size="14" font-style="italic">a</text>
  <text x="320" y="714" font-size="13" fill="#444">f&#8336;(a) = 1 entre 1/2 e 3/2</text>
  <text x="230" y="790" font-size="12.5" text-anchor="middle">1/2</text>
  <text x="410" y="790" font-size="12.5" text-anchor="middle">3/2</text>
  <line x1="104" y1="806" x2="284" y2="806" stroke="#b45309" stroke-width="2.4"/>
  <line x1="104" y1="798" x2="104" y2="814" stroke="#b45309" stroke-width="2.4"/>
  <line x1="284" y1="798" x2="284" y2="814" stroke="#b45309" stroke-width="2.4"/>
  <text x="104" y="826" font-size="12" fill="#b45309" text-anchor="middle">&#8722;0,2</text>
  <text x="284" y="826" font-size="12" fill="#b45309" text-anchor="middle">0,8</text>
  <text x="600" y="742" font-size="13.5" fill="#1d4ed8">azul: centros que funcionam E</text>
  <text x="600" y="762" font-size="13.5" fill="#1d4ed8">que A pode assumir</text>
  <text x="600" y="782" font-size="13.5" fill="#1d4ed8">comprimento 0,3, logo p(0,3) = 0,3</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
