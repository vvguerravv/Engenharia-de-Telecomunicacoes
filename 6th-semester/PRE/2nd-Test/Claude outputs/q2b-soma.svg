<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#1a1a1a"/></marker></defs>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="40" y="38" font-size="18">Distribuicao de A + C, com A e C independentes, cada uma Bernoulli(1/4)</text>
  <text x="40" y="60" font-size="13.5" fill="#555">P[vale 1] = 1/4   e   P[vale 0] = 3/4</text>

  <!-- cabecalhos -->
  <text x="150" y="112" font-size="14" text-anchor="middle">C = 0  (3/4)</text>
  <text x="270" y="112" font-size="14" text-anchor="middle">C = 1  (1/4)</text>
  <text x="82" y="180" font-size="14" text-anchor="end">A = 0</text>
  <text x="82" y="196" font-size="12" text-anchor="end" fill="#555">(3/4)</text>
  <text x="82" y="270" font-size="14" text-anchor="end">A = 1</text>
  <text x="82" y="286" font-size="12" text-anchor="end" fill="#555">(1/4)</text>

  <!-- celulas -->
  <rect x="90" y="130" width="120" height="90" fill="#dbeafe" stroke="#64748b"/>
  <text x="150" y="168" font-size="15" text-anchor="middle">soma = 0</text>
  <text x="150" y="192" font-size="14" text-anchor="middle" fill="#334155">9/16</text>

  <rect x="210" y="130" width="120" height="90" fill="#fef3c7" stroke="#64748b"/>
  <text x="270" y="168" font-size="15" text-anchor="middle">soma = 1</text>
  <text x="270" y="192" font-size="14" text-anchor="middle" fill="#334155">3/16</text>

  <rect x="90" y="220" width="120" height="90" fill="#fef3c7" stroke="#64748b"/>
  <text x="150" y="258" font-size="15" text-anchor="middle">soma = 1</text>
  <text x="150" y="282" font-size="14" text-anchor="middle" fill="#334155">3/16</text>

  <rect x="210" y="220" width="120" height="90" fill="#dcfce7" stroke="#64748b"/>
  <text x="270" y="258" font-size="15" text-anchor="middle">soma = 2</text>
  <text x="270" y="282" font-size="14" text-anchor="middle" fill="#334155">1/16</text>

  <text x="90" y="338" font-size="13" fill="#555">cada celula: multiplica as duas probabilidades (sao independentes)</text>

  <!-- seta -->
  <line x1="360" y1="220" x2="430" y2="220" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="395" y="208" font-size="13" text-anchor="middle" fill="#555">junta</text>
  <text x="395" y="240" font-size="13" text-anchor="middle" fill="#555">por soma</text>

  <!-- PMF -->
  <line x1="490" y1="320" x2="780" y2="320" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="510" y1="325" x2="510" y2="130" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="788" y="326" font-size="14" font-style="italic">x</text>

  <line x1="560" y1="320" x2="560" y2="174" stroke="#2563eb" stroke-width="4"/>
  <circle cx="560" cy="174" r="5.5" fill="#2563eb"/>
  <text x="560" y="162" font-size="14" text-anchor="middle" fill="#2563eb">9/16</text>

  <line x1="640" y1="320" x2="640" y2="222" stroke="#d97706" stroke-width="4"/>
  <circle cx="640" cy="222" r="5.5" fill="#d97706"/>
  <text x="640" y="210" font-size="14" text-anchor="middle" fill="#d97706">6/16</text>
  <text x="640" y="192" font-size="12.5" text-anchor="middle" fill="#d97706">3/16 + 3/16</text>

  <line x1="720" y1="320" x2="720" y2="304" stroke="#16a34a" stroke-width="4"/>
  <circle cx="720" cy="304" r="5.5" fill="#16a34a"/>
  <text x="740" y="300" font-size="14" fill="#16a34a">1/16</text>

  <text x="560" y="342" font-size="14" text-anchor="middle">0</text>
  <text x="640" y="342" font-size="14" text-anchor="middle">1</text>
  <text x="720" y="342" font-size="14" text-anchor="middle">2</text>
  <text x="490" y="376" font-size="13.5" fill="#555">dois caminhos diferentes levam a soma 1, por isso aquela haste e o dobro</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
