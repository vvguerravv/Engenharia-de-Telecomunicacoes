<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#1a1a1a"/></marker></defs><rect width="900" height="410" fill="#ffffff"/><text x="40" y="34" font-size="18">A regra: cada bit gera DOIS valores consecutivos de X[n]</text><text x="235" y="78" font-size="15" text-anchor="middle">bit = 0  &#8594;  (+1, &#8722;1)</text><line x1="150" y1="150" x2="330" y2="150" stroke="#1a1a1a" stroke-width="1.4"/><line x1="190" y1="150" x2="190" y2="105" stroke="#1d4ed8" stroke-width="3"/><circle cx="190" cy="105" r="5" fill="#1d4ed8"/><line x1="270" y1="150" x2="270" y2="195" stroke="#1d4ed8" stroke-width="3"/><circle cx="270" cy="195" r="5" fill="#1d4ed8"/><text x="190" y="170" font-size="12.5" text-anchor="middle">par</text><text x="270" y="170" font-size="12.5" text-anchor="middle">impar</text><text x="645" y="78" font-size="15" text-anchor="middle">bit = 1  &#8594;  (&#8722;1, +1)</text><line x1="560" y1="150" x2="740" y2="150" stroke="#1a1a1a" stroke-width="1.4"/><line x1="600" y1="150" x2="600" y2="195" stroke="#1d4ed8" stroke-width="3"/><circle cx="600" cy="195" r="5" fill="#1d4ed8"/><line x1="680" y1="150" x2="680" y2="105" stroke="#1d4ed8" stroke-width="3"/><circle cx="680" cy="105" r="5" fill="#1d4ed8"/><text x="600" y="170" font-size="12.5" text-anchor="middle">par</text><text x="680" y="170" font-size="12.5" text-anchor="middle">impar</text><text x="40" y="200" font-size="13.5" fill="#555">Nos dois casos o segundo valor e o oposto do primeiro. O bit so decide qual vem primeiro.</text><text x="40" y="240" font-size="17">Exemplo do enunciado, bits 1, 0, 0, 1</text><line x1="80" y1="345" x2="770" y2="345" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#ah)"/><text x="782" y="351" font-size="14" font-style="italic">n</text><line x1="110" y1="345" x2="110" y2="390" stroke="#1d4ed8" stroke-width="3"/><circle cx="110" cy="390" r="5" fill="#1d4ed8"/><text x="110" y="367" font-size="13" text-anchor="middle">0</text><line x1="195" y1="345" x2="195" y2="300" stroke="#1d4ed8" stroke-width="3"/><circle cx="195" cy="300" r="5" fill="#1d4ed8"/><text x="195" y="367" font-size="13" text-anchor="middle">1</text><line x1="280" y1="345" x2="280" y2="300" stroke="#1d4ed8" stroke-width="3"/><circle cx="280" cy="300" r="5" fill="#1d4ed8"/><text x="280" y="367" font-size="13" text-anchor="middle">2</text><line x1="365" y1="345" x2="365" y2="390" stroke="#1d4ed8" stroke-width="3"/><circle cx="365" cy="390" r="5" fill="#1d4ed8"/><text x="365" y="367" font-size="13" text-anchor="middle">3</text><line x1="450" y1="345" x2="450" y2="300" stroke="#1d4ed8" stroke-width="3"/><circle cx="450" cy="300" r="5" fill="#1d4ed8"/><text x="450" y="367" font-size="13" text-anchor="middle">4</text><line x1="535" y1="345" x2="535" y2="390" stroke="#1d4ed8" stroke-width="3"/><circle cx="535" cy="390" r="5" fill="#1d4ed8"/><text x="535" y="367" font-size="13" text-anchor="middle">5</text><line x1="620" y1="345" x2="620" y2="390" stroke="#1d4ed8" stroke-width="3"/><circle cx="620" cy="390" r="5" fill="#1d4ed8"/><text x="620" y="367" font-size="13" text-anchor="middle">6</text><line x1="705" y1="345" x2="705" y2="300" stroke="#1d4ed8" stroke-width="3"/><circle cx="705" cy="300" r="5" fill="#1d4ed8"/><text x="705" y="367" font-size="13" text-anchor="middle">7</text><line x1="92" y1="272" x2="213" y2="272" stroke="#b45309" stroke-width="2"/><line x1="92" y1="272" x2="92" y2="280" stroke="#b45309" stroke-width="2"/><line x1="213" y1="272" x2="213" y2="280" stroke="#b45309" stroke-width="2"/><text x="152.5" y="266" font-size="13" fill="#b45309" text-anchor="middle">bit 1</text><line x1="262" y1="272" x2="383" y2="272" stroke="#b45309" stroke-width="2"/><line x1="262" y1="272" x2="262" y2="280" stroke="#b45309" stroke-width="2"/><line x1="383" y1="272" x2="383" y2="280" stroke="#b45309" stroke-width="2"/><text x="322.5" y="266" font-size="13" fill="#b45309" text-anchor="middle">bit 0</text><line x1="432" y1="272" x2="553" y2="272" stroke="#b45309" stroke-width="2"/><line x1="432" y1="272" x2="432" y2="280" stroke="#b45309" stroke-width="2"/><line x1="553" y1="272" x2="553" y2="280" stroke="#b45309" stroke-width="2"/><text x="492.5" y="266" font-size="13" fill="#b45309" text-anchor="middle">bit 0</text><line x1="602" y1="272" x2="723" y2="272" stroke="#b45309" stroke-width="2"/><line x1="602" y1="272" x2="602" y2="280" stroke="#b45309" stroke-width="2"/><line x1="723" y1="272" x2="723" y2="280" stroke="#b45309" stroke-width="2"/><text x="662.5" y="266" font-size="13" fill="#b45309" text-anchor="middle">bit 1</text><text x="40" y="403" font-size="13.5" fill="#555">Os pares sao sempre (0,1), (2,3), (4,5), ... Dentro do par ha travamento total; entre pares diferentes nao ha relacao nenhuma.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>