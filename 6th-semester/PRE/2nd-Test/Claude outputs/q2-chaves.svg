<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="40" y="36" font-size="18">Cada rect e uma chave: vale 1 (ligado) ou 0 (desligado), conforme o instante t</text>
  <text x="40" y="58" font-size="13.5" fill="#555">A, B e C sao sorteadas UMA vez e nunca mudam. Quem muda com o tempo sao as chaves.</text>

  <!-- cabecalho -->
  <rect x="60" y="80" width="200" height="44" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="260" y="80" width="150" height="44" fill="#f1f5f9" stroke="#94a3b8"/>
  <rect x="410" y="80" width="150" height="44" fill="#f1f5f9" stroke="#94a3b8"/>
  <rect x="560" y="80" width="150" height="44" fill="#f1f5f9" stroke="#94a3b8"/>
  <rect x="710" y="80" width="150" height="44" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="335" y="108" font-size="15" text-anchor="middle">t &lt; 0</text>
  <text x="485" y="108" font-size="15" text-anchor="middle">0 &lt; t &lt; 4</text>
  <text x="635" y="108" font-size="15" text-anchor="middle">4 &lt; t &lt; 8</text>
  <text x="785" y="108" font-size="15" text-anchor="middle">t &gt; 8</text>

  <!-- linha 1: rect A -->
  <rect x="60" y="124" width="200" height="56" fill="#ffffff" stroke="#94a3b8"/>
  <text x="250" y="150" font-size="14" text-anchor="end">A &#183; rect((t &#8722; 2)/4)</text>
  <text x="250" y="168" font-size="11.5" text-anchor="end" fill="#777">ligado em (0, 4)</text>
  <rect x="260" y="124" width="150" height="56" fill="#f3f4f6" stroke="#94a3b8"/><text x="335" y="159" font-size="17" text-anchor="middle" fill="#9ca3af">0</text>
  <rect x="410" y="124" width="150" height="56" fill="#dcfce7" stroke="#94a3b8"/><text x="485" y="159" font-size="17" text-anchor="middle" fill="#15803d">1</text>
  <rect x="560" y="124" width="150" height="56" fill="#f3f4f6" stroke="#94a3b8"/><text x="635" y="159" font-size="17" text-anchor="middle" fill="#9ca3af">0</text>
  <rect x="710" y="124" width="150" height="56" fill="#f3f4f6" stroke="#94a3b8"/><text x="785" y="159" font-size="17" text-anchor="middle" fill="#9ca3af">0</text>

  <!-- linha 2: rect B -->
  <rect x="60" y="180" width="200" height="56" fill="#ffffff" stroke="#94a3b8"/>
  <text x="250" y="206" font-size="14" text-anchor="end">B &#183; rect((t &#8722; 6)/4)</text>
  <text x="250" y="224" font-size="11.5" text-anchor="end" fill="#777">ligado em (4, 8)</text>
  <rect x="260" y="180" width="150" height="56" fill="#f3f4f6" stroke="#94a3b8"/><text x="335" y="215" font-size="17" text-anchor="middle" fill="#9ca3af">0</text>
  <rect x="410" y="180" width="150" height="56" fill="#f3f4f6" stroke="#94a3b8"/><text x="485" y="215" font-size="17" text-anchor="middle" fill="#9ca3af">0</text>
  <rect x="560" y="180" width="150" height="56" fill="#dcfce7" stroke="#94a3b8"/><text x="635" y="215" font-size="17" text-anchor="middle" fill="#15803d">1</text>
  <rect x="710" y="180" width="150" height="56" fill="#f3f4f6" stroke="#94a3b8"/><text x="785" y="215" font-size="17" text-anchor="middle" fill="#9ca3af">0</text>

  <!-- linha 3: rect C -->
  <rect x="60" y="236" width="200" height="56" fill="#ffffff" stroke="#94a3b8"/>
  <text x="250" y="262" font-size="14" text-anchor="end">C &#183; rect((t &#8722; 4)/8)</text>
  <text x="250" y="280" font-size="11.5" text-anchor="end" fill="#777">ligado em (0, 8)</text>
  <rect x="260" y="236" width="150" height="56" fill="#f3f4f6" stroke="#94a3b8"/><text x="335" y="271" font-size="17" text-anchor="middle" fill="#9ca3af">0</text>
  <rect x="410" y="236" width="150" height="56" fill="#dcfce7" stroke="#94a3b8"/><text x="485" y="271" font-size="17" text-anchor="middle" fill="#15803d">1</text>
  <rect x="560" y="236" width="150" height="56" fill="#dcfce7" stroke="#94a3b8"/><text x="635" y="271" font-size="17" text-anchor="middle" fill="#15803d">1</text>
  <rect x="710" y="236" width="150" height="56" fill="#f3f4f6" stroke="#94a3b8"/><text x="785" y="271" font-size="17" text-anchor="middle" fill="#9ca3af">0</text>

  <!-- linha X -->
  <rect x="60" y="292" width="200" height="56" fill="#fffbeb" stroke="#94a3b8"/>
  <text x="250" y="326" font-size="16" text-anchor="end">X(t) =</text>
  <rect x="260" y="292" width="150" height="56" fill="#fffbeb" stroke="#94a3b8"/><text x="335" y="327" font-size="17" text-anchor="middle">0</text>
  <rect x="410" y="292" width="150" height="56" fill="#fef3c7" stroke="#94a3b8"/><text x="485" y="327" font-size="17" text-anchor="middle" fill="#b45309">A + C</text>
  <rect x="560" y="292" width="150" height="56" fill="#fef3c7" stroke="#94a3b8"/><text x="635" y="327" font-size="17" text-anchor="middle" fill="#b45309">B + C</text>
  <rect x="710" y="292" width="150" height="56" fill="#fffbeb" stroke="#94a3b8"/><text x="785" y="327" font-size="17" text-anchor="middle">0</text>

  <text x="60" y="380" font-size="14" fill="#333">Quem esta ligado multiplica sua variavel por 1 e aparece na soma. Quem esta desligado multiplica por 0 e some.</text>
  <text x="60" y="402" font-size="13.5" fill="#555">Depois dessa substituicao, X(t) virou uma variavel aleatoria comum, e todo o resto (PMF, media, segunda ordem) sai dela.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
