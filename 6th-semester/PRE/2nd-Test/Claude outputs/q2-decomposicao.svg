<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#1a1a1a"/></marker></defs><rect width="900" height="420" fill="#ffffff"/><text x="40" y="38" font-size="18">Os tres rects: cada um liga uma variavel num trecho de tempo</text><text x="120" y="135" font-size="14" text-anchor="end">rect((t-2)/4)</text><line x1="89.2" y1="130" x2="762.4000000000001" y2="130" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#ah)"/><path d="M89.2,130 L130.0,130 L130.0,88 L402.0,88 L402.0,130 L748.8,130" fill="none" stroke="#1d4ed8" stroke-width="2.8"/><text x="266.0" y="80" font-size="13" fill="#1d4ed8" text-anchor="middle">liga A</text><line x1="130.0" y1="130" x2="130.0" y2="135" stroke="#1a1a1a" stroke-width="1.2"/><text x="130.0" y="150" font-size="12" text-anchor="middle">0</text><line x1="402.0" y1="130" x2="402.0" y2="135" stroke="#1a1a1a" stroke-width="1.2"/><text x="402.0" y="150" font-size="12" text-anchor="middle">4</text><line x1="674.0" y1="130" x2="674.0" y2="135" stroke="#1a1a1a" stroke-width="1.2"/><text x="674.0" y="150" font-size="12" text-anchor="middle">8</text><text x="776.0" y="135" font-size="13" font-style="italic">t</text><text x="120" y="220" font-size="14" text-anchor="end">rect((t-6)/4)</text><line x1="89.2" y1="215" x2="762.4000000000001" y2="215" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#ah)"/><path d="M89.2,215 L402.0,215 L402.0,173 L674.0,173 L674.0,215 L748.8,215" fill="none" stroke="#15803d" stroke-width="2.8"/><text x="538.0" y="165" font-size="13" fill="#15803d" text-anchor="middle">liga B</text><line x1="130.0" y1="215" x2="130.0" y2="220" stroke="#1a1a1a" stroke-width="1.2"/><text x="130.0" y="235" font-size="12" text-anchor="middle">0</text><line x1="402.0" y1="215" x2="402.0" y2="220" stroke="#1a1a1a" stroke-width="1.2"/><text x="402.0" y="235" font-size="12" text-anchor="middle">4</text><line x1="674.0" y1="215" x2="674.0" y2="220" stroke="#1a1a1a" stroke-width="1.2"/><text x="674.0" y="235" font-size="12" text-anchor="middle">8</text><text x="776.0" y="220" font-size="13" font-style="italic">t</text><text x="120" y="305" font-size="14" text-anchor="end">rect((t-4)/8)</text><line x1="89.2" y1="300" x2="762.4000000000001" y2="300" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#ah)"/><path d="M89.2,300 L130.0,300 L130.0,258 L674.0,258 L674.0,300 L748.8,300" fill="none" stroke="#b45309" stroke-width="2.8"/><text x="402.0" y="250" font-size="13" fill="#b45309" text-anchor="middle">liga C</text><line x1="130.0" y1="300" x2="130.0" y2="305" stroke="#1a1a1a" stroke-width="1.2"/><text x="130.0" y="320" font-size="12" text-anchor="middle">0</text><line x1="402.0" y1="300" x2="402.0" y2="305" stroke="#1a1a1a" stroke-width="1.2"/><text x="402.0" y="320" font-size="12" text-anchor="middle">4</text><line x1="674.0" y1="300" x2="674.0" y2="305" stroke="#1a1a1a" stroke-width="1.2"/><text x="674.0" y="320" font-size="12" text-anchor="middle">8</text><text x="776.0" y="305" font-size="13" font-style="italic">t</text><line x1="130" y1="340" x2="130" y2="300" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><line x1="402" y1="340" x2="402" y2="300" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><line x1="674" y1="340" x2="674" y2="300" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><text x="40" y="370" font-size="16">Somando:</text><text x="266" y="370" font-size="16" fill="#1d4ed8" text-anchor="middle">0 &lt; t &lt; 4:  X(t) = A + C</text><text x="538" y="370" font-size="16" fill="#15803d" text-anchor="middle">4 &lt; t &lt; 8:  X(t) = B + C</text><text x="40" y="398" font-size="14" fill="#555">Fora de (0, 8) nenhum rect esta ligado, entao X(t) = 0.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>