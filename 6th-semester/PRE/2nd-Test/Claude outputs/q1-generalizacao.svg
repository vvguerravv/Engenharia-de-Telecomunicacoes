<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="40" y="38" font-size="18">A janela (t &#8722; 1/2, t + 1/2) deslizando sobre o suporte de A</text>
  <text x="40" y="62" font-size="13.5" fill="#555">cinza: valores possiveis de A    laranja: a janela    azul: a intersecao, cujo comprimento e p(t)</text>

  <!-- guias verticais do suporte -->
  <line x1="280" y1="86" x2="280" y2="556" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="480" y1="86" x2="480" y2="556" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="280" y="98" font-size="13" text-anchor="middle" fill="#555">1/2</text>
  <text x="480" y="98" font-size="13" text-anchor="middle" fill="#555">3/2</text>

  <!-- ROW t=-0,3 : janela 20..220, sem intersecao -->
  <text x="150" y="135" font-size="14" text-anchor="end">t = &#8722;0,3</text>
  <rect x="280" y="117" width="200" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <rect x="20" y="117" width="200" height="26" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="610" y="135" font-size="14" fill="#b91c1c">p = 0</text>
  <text x="690" y="135" font-size="13" fill="#555">janela ainda nao chegou</text>

  <!-- ROW t=0,3 : janela 140..340, overlap 280..340 -->
  <text x="150" y="195" font-size="14" text-anchor="end">t = 0,3</text>
  <rect x="280" y="177" width="200" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <rect x="280" y="177" width="60" height="26" fill="#bfdbfe"/>
  <rect x="140" y="177" width="200" height="26" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="610" y="195" font-size="14" fill="#1d4ed8">p = 0,3</text>
  <text x="690" y="195" font-size="13" fill="#555">entrando pela esquerda</text>

  <!-- ROW t=0,7 : janela 220..420, overlap 280..420 -->
  <text x="150" y="255" font-size="14" text-anchor="end">t = 0,7</text>
  <rect x="280" y="237" width="200" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <rect x="280" y="237" width="140" height="26" fill="#bfdbfe"/>
  <rect x="220" y="237" width="200" height="26" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="610" y="255" font-size="14" fill="#1d4ed8">p = 0,7</text>
  <text x="690" y="255" font-size="13" fill="#555">entrando pela esquerda</text>

  <!-- ROW t=1 : janela 280..480, overlap total -->
  <text x="150" y="315" font-size="14" text-anchor="end">t = 1</text>
  <rect x="280" y="297" width="200" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <rect x="280" y="297" width="200" height="26" fill="#bfdbfe"/>
  <rect x="280" y="297" width="200" height="26" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="610" y="315" font-size="14" fill="#1d4ed8">p = 1</text>
  <text x="690" y="315" font-size="13" fill="#555">encaixe perfeito</text>

  <!-- ROW t=1,4 : janela 360..560, overlap 360..480 -->
  <text x="150" y="375" font-size="14" text-anchor="end">t = 1,4</text>
  <rect x="280" y="357" width="200" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <rect x="360" y="357" width="120" height="26" fill="#bfdbfe"/>
  <rect x="360" y="357" width="200" height="26" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="610" y="375" font-size="14" fill="#1d4ed8">p = 0,6</text>
  <text x="690" y="375" font-size="13" fill="#555">saindo pela direita</text>

  <!-- ROW t=1,9 : janela 460..660, overlap 460..480 -->
  <text x="150" y="435" font-size="14" text-anchor="end">t = 1,9</text>
  <rect x="280" y="417" width="200" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <rect x="460" y="417" width="20" height="26" fill="#bfdbfe"/>
  <rect x="460" y="417" width="200" height="26" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="610" y="435" font-size="14" fill="#1d4ed8">p = 0,1</text>
  <text x="690" y="435" font-size="13" fill="#555">saindo pela direita</text>

  <!-- ROW t=2,3 : janela 560..760, sem intersecao -->
  <text x="150" y="495" font-size="14" text-anchor="end">t = 2,3</text>
  <rect x="280" y="477" width="200" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <rect x="560" y="477" width="200" height="26" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="610" y="528" font-size="14" fill="#b91c1c">p = 0</text>
  <text x="690" y="528" font-size="13" fill="#555">janela ja passou</text>

  <text x="40" y="572" font-size="14" fill="#333">Quem manda na borda esquerda da intersecao: o maior entre 1/2 e t &#8722; 1/2.   Na direita: o menor entre 3/2 e t + 1/2.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
