<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#1a1a1a"/></marker></defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="40" y="34" font-size="18">Como achar os intervalos: marque o suporte de cada rect e junte os extremos</text>

  <!-- linhas de corte -->
  <line x1="180" y1="56" x2="180" y2="300" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4"/>
  <line x1="420" y1="56" x2="420" y2="300" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4"/>
  <line x1="660" y1="56" x2="660" y2="300" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="180" y="50" font-size="13" fill="#b45309" text-anchor="middle">0</text>
  <text x="420" y="50" font-size="13" fill="#b45309" text-anchor="middle">4</text>
  <text x="660" y="50" font-size="13" fill="#b45309" text-anchor="middle">8</text>

  <!-- barras de suporte -->
  <rect x="180" y="72" width="240" height="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="300" y="90" font-size="14" text-anchor="middle" fill="#1d4ed8">A ligado</text>
  <text x="170" y="90" font-size="13" text-anchor="end">centro 2, largura 4</text>
  <text x="440" y="90" font-size="13" fill="#555">(0, 4)</text>

  <rect x="420" y="122" width="240" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="540" y="140" font-size="14" text-anchor="middle" fill="#15803d">B ligado</text>
  <text x="410" y="140" font-size="13" text-anchor="end">centro 6, largura 4</text>
  <text x="680" y="140" font-size="13" fill="#555">(4, 8)</text>

  <rect x="180" y="172" width="480" height="26" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="420" y="190" font-size="14" text-anchor="middle" fill="#b45309">C ligado</text>
  <text x="170" y="190" font-size="13" text-anchor="end">centro 4, largura 8</text>
  <text x="680" y="190" font-size="13" fill="#555">(0, 8)</text>

  <!-- eixo -->
  <line x1="60" y1="240" x2="850" y2="240" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="858" y="246" font-size="14" font-style="italic">t</text>
  <line x1="180" y1="240" x2="180" y2="246" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="420" y1="240" x2="420" y2="246" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="660" y1="240" x2="660" y2="246" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="180" y="262" font-size="13" text-anchor="middle">0</text>
  <text x="420" y="262" font-size="13" text-anchor="middle">4</text>
  <text x="660" y="262" font-size="13" text-anchor="middle">8</text>

  <!-- zonas -->
  <text x="120" y="292" font-size="14" text-anchor="middle">t &lt; 0</text>
  <text x="300" y="292" font-size="14" text-anchor="middle">0 &lt; t &lt; 4</text>
  <text x="540" y="292" font-size="14" text-anchor="middle">4 &lt; t &lt; 8</text>
  <text x="750" y="292" font-size="14" text-anchor="middle">t &gt; 8</text>
  <text x="120" y="314" font-size="14" text-anchor="middle" fill="#555">X = 0</text>
  <text x="300" y="314" font-size="14" text-anchor="middle" fill="#b45309">X = A + C</text>
  <text x="540" y="314" font-size="14" text-anchor="middle" fill="#b45309">X = B + C</text>
  <text x="750" y="314" font-size="14" text-anchor="middle" fill="#555">X = 0</text>

  <text x="40" y="356" font-size="14" fill="#333">Os extremos dos tres suportes sao 0, 4, 8, 0 e 8. Lista limpa: 0, 4, 8. Esses tres cortes dividem o eixo em quatro faixas.</text>
  <text x="40" y="378" font-size="13.5" fill="#555">Dentro de cada faixa nenhuma chave vira, entao basta testar um t qualquer dela.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
